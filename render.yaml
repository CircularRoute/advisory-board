# Render blueprint: deploys the Advisory Board console (advisory-board/) as a
# key-protected web service, reachable from anywhere.
#
# After "New > Blueprint" on render.com pointing at this repo:
#   1. Set ANTHROPIC_API_KEY and OPENAI_API_KEY in the dashboard (and
#      GEMINI_API_KEY only if you will seat Google). Never commit keys.
#   2. BOARD_ACCESS_KEY is generated by Render - copy it from the dashboard;
#      the console prompts for it on first use and remembers it per browser.
#   3. Runs persist on the attached disk (BOARD_RUNS_DIR), surviving deploys.
#
# The console binds publicly ONLY because BOARD_ACCESS_KEY is set; without a
# key it refuses to leave 127.0.0.1. A full run takes minutes - progress
# streams over SSE, and the record is always in "Past runs" afterwards.
services:
  - type: web
    name: advisory-board
    runtime: node
    rootDir: advisory-board
    plan: starter
    buildCommand: echo "zero dependencies - no build step"
    startCommand: node console.js
    healthCheckPath: /healthz
    envVars:
      - key: BOARD_ACCESS_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BOARD_RUNS_DIR
        value: /var/data/runs
    disk:
      name: board-runs
      mountPath: /var/data
      sizeGB: 1
